# Arraymancer compilation flag config

@if cudnn:
  define:"cuda"
@end

# Nim cfg is not aware of new define within the file: https://github.com/nim-lang/Nim/issues/6698

@if cuda or cudnn:
  # compile with "cpp" backend.
  # See https://github.com/mratsim/Arraymancer/issues/371

  # ###########################################################################
  # Iluvatar CoreX (ivcore11) port
  # ---------------------------------------------------------------------------
  # Upstream targets NVIDIA NVCC. On the CoreX SDK there is no usable nvcc
  # (it is a shell stub) and NVCC is forbidden, so the whole Nim-generated C++
  # is compiled with the CoreX clang++ front-end in CUDA/"ivcore" mode:
  #   -x ivcore --cuda-gpu-arch=ivcore11
  # cuBLAS/cuDNN/cudart calls resolve at runtime (nimcuda dlopen) against the
  # CoreX libraries in /usr/local/corex/lib64.
  cincludes:"/usr/local/corex/include"
  clibdir:"/usr/local/corex/lib64"
  cc:"clang"
  clang.cpp.exe:"/usr/local/corex/bin/clang++"
  clang.cpp.linkerexe:"/usr/local/corex/bin/clang++"
  clang.cpp.options.debug: "-g"
  clang.cpp.options.speed: "-O3 -fno-strict-aliasing"
  clang.cpp.options.size: "-Os"
  # Interpret every Nim-generated .cpp as CoreX CUDA (ivcore) and target ivcore11.
  # -fcuda-allow-variadic-functions: tolerate device-side variadic idioms.
  clang.cpp.options.always:"-x ivcore --cuda-gpu-arch=ivcore11 -include /home/repos/Arraymancer/corex_ivcore_shim.h -Wno-unused-command-line-argument -Wno-deprecated"
  # nimcuda auto-detects CUDA under /usr/local/cuda; redirect it to the CoreX SDK.
  define:"CudaIncludes=/usr/local/corex/include"
  define:"CudaLib=/usr/local/corex/lib64"
  # -lcudart supplies the ivcore kernel-launch runtime (ixLaunchKernel,
  # __ixPushCallConfiguration, ...) emitted for `<<<>>>` launches; cuBLAS/cuDNN/cudart
  # API calls themselves are dlopen'd by nimcuda so only the launch runtime is linked.
  passL:"-L/usr/local/corex/lib64 -lcudart -Wl,-rpath,/usr/local/corex/lib64"

  # Original NVIDIA NVCC configuration (kept for reference):
  # cincludes:"/opt/cuda/include"
  # cc:"clang"
  # clang.cpp.exe:"/opt/cuda/bin/nvcc"
  # clang.cpp.linkerexe:"/opt/cuda/bin/nvcc"
  # clang.cpp.options.debug: "-Xcompiler -Og"
  # clang.cpp.options.speed: "-Xcompiler -O3 -Xcompiler -fno-strict-aliasing"
  # clang.cpp.options.size: "-Xcompiler -Os"
  # clang.cpp.options.always:"-gencode arch=compute_61,code=sm_61 -gencode arch=compute_75,code=sm_75 --x cu -Xcompiler -fpermissive"

@end

@if openblas:
  define:"blas=openblas" # For nimblas
  define:"lapack=openblas" # For nimlapack
  @if macosx:
    clibdir:"/usr/local/opt/openblas/lib"
    cincludes:"/usr/local/opt/openblas/include"
  @end
@end

# blis # Completely managed in the blis backend code

# native # -march=native flag is Handled in the code

@if mkl: # MKL multi_threaded
  define:"openmp"
  define:"blas=mkl_intel_lp64"
  define:"lapack=mkl_intel_lp64"
  clibdir:"/opt/intel/mkl/lib/intel64"
  passl:"/opt/intel/mkl/lib/intel64/libmkl_intel_lp64.a"
  passl:"-lmkl_core"
  passl:"-lmkl_gnu_thread"
  passl:"-lgomp"
  dynlibOverride:"mkl_intel_lp64"
@end

@if openmp or mkl:
  stackTrace:off
  @if macosx: # Default compiler on Mac is clang without OpenMP and gcc is an alias to clang.
              # Use Homebrew GCC instead for OpenMP support. GCC (v7), must be properly linked via `brew link gcc`
    cc:"gcc"
    gcc.exe:"/usr/local/bin/gcc-7"
    gcc.linkerexe:"/usr/local/bin/gcc-7"
  @end
@end

# ############################################################
#
#                    SIMD flags
#
# ############################################################

gemm_ukernel_sse.always = "-msse"
gemm_ukernel_sse2.always = "-msse2"
gemm_ukernel_sse4_1.always = "-msse4.1"
gemm_ukernel_avx.always = "-mavx"
gemm_ukernel_avx_fma.always = "-mavx -mfma"
gemm_ukernel_avx2.always = "-mavx2"
gemm_ukernel_avx512.always = "-mavx512f -mavx512dq"


# Set project wide style check to "usages" so that we are only hinted / errored
# for style that mismatches with our initial usage of variables / proc names.
styleCheck:"usages"